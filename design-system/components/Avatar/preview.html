<script>
const t = document.getElementById('specimen').innerHTML;
const cells = [];
for (const theme of ['light', 'dark']) for (const exp of ['quiet'])
  cells.push(`<div data-theme="${theme}" data-expression="${exp}"><p class="t-caption t-tertiary" style="margin-bottom:var(--space-3)">${theme} · ${exp}</p>${t}</div>`);
document.getElementById('mx').innerHTML = cells.join('');
</script>
<script>
/* c-avatar — <span class="c-avatar c-avatar--lg" data-name="Priya Nair" data-src="../_assets/clients/av3.jpg"></span>
   Fills initials ("Krish (me)" → K), loads image on top, falls back to initials if the image fails. */
(function () {
  const initials = n => String(n || '').replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  function render(a) {
    if (a.dataset.cBound) return; a.dataset.cBound = '1';
    const size = a.classList.contains('c-avatar--sm') ? 't-badge' : a.classList.contains('c-avatar--lg') ? 't-meta' : 't-caption';
    a.innerHTML = `<span class="${size}" aria-hidden="true">${initials(a.dataset.name)}</span>`;
    if (!a.hasAttribute('aria-label') && a.dataset.name) { a.setAttribute('role', 'img'); a.setAttribute('aria-label', a.dataset.name); }
    if (a.dataset.src) { const i = new Image(); i.alt = ''; i.onload = () => a.appendChild(i); i.src = a.dataset.src; }
  }
  window.cAvatar = { init: (s = document) => s.querySelectorAll('.c-avatar[data-name]').forEach(render), initials };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', () => window.cAvatar.init()) : window.cAvatar.init();
})();

</script>

</body></html>
