<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><style>
html,body{margin:0;background:var(--bg-page)}

<svg viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Radius Mobile">

blocks: action-primary (green) 96x190, accent-teal-7 (deep) 96x250, accent-teal-2 (mint) 96x150, surface-tile 96x210; widths are space-24, gap space-4 + space-2

-->
