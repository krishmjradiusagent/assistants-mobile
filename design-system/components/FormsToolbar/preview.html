<script>
/* c-menu — attach(trigger, menu, {align:'end'|'start', place:'below'|'above', matchWidth:bool, keepOpen:bool}). Menu element needs popover="manual" + class c-menu.
   Handles: open/close, placement (flips if no room), ↑↓ focus, Esc, outside click, scroll close, aria-expanded. */
(function () {
  const openMenus = new Set();
  function attach(trigger, menu, opts = {}) {
    if (trigger.dataset.cMenuBound) return; trigger.dataset.cMenuBound = '1';
    const items = () => [...menu.querySelectorAll('.c-menu__item:not([disabled]):not(.c-menu__item--static)')];
    const isOpen = () => menu.matches(':popover-open');
    const place = () => { if (opts.matchWidth) menu.style.minWidth = Math.max(200, trigger.getBoundingClientRect().width) + 'px'; const r = trigger.getBoundingClientRect(), mw = menu.offsetWidth, mh = menu.offsetHeight; const up = opts.place === 'above' ? r.top - 8 - mh > 0 : !(r.bottom + 8 + mh < innerHeight); menu.style.top = (up ? r.top - 8 - mh : r.bottom + 8) + 'px'; const left = opts.align === 'start' ? r.left : r.right - mw; menu.style.left = Math.max(8, Math.min(innerWidth - mw - 8, left)) + 'px'; };
    const close = (focus) => { if (isOpen()) menu.hidePopover(); openMenus.delete(api); trigger.setAttribute('aria-expanded', 'false'); if (focus) trigger.focus(); };
    const open = () => { openMenus.forEach(m => m.close()); menu.showPopover(); place(); openMenus.add(api); trigger.setAttribute('aria-expanded', 'true'); const sel = menu.querySelector('[aria-checked="true"]') || items()[0]; sel && sel.focus(); };
    const api = { close, open, isOpen, trigger, menu };
    trigger.setAttribute('aria-expanded', 'false');
    trigger.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); isOpen() ? close(true) : open(); });
    menu.addEventListener('click', e => { e.stopPropagation(); const it = e.target.closest('.c-menu__item'); if (it && !it.classList.contains('c-menu__item--static') && !opts.keepOpen) close(true); });
    menu.addEventListener('keydown', e => { const list = items(), i = list.indexOf(document.activeElement); if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length]?.focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length]?.focus(); } if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(true); } });   // stop: Esc closes only the menu, not the sheet behind it
    return api;
  }
  document.addEventListener('click', () => openMenus.forEach(m => m.close(false)));
  addEventListener('scroll', () => openMenus.forEach(m => m.close(false)), true);
  addEventListener('resize', () => openMenus.forEach(m => m.close(false)));
  window.cMenu = { attach };
})();

</script>
<script>
/* c-swipe — swipe left ≥45px (or ← key) reveals .c-swipe__actions; → / Esc / outside tap hides.
   Ignores drags starting on [data-no-swipe], buttons, inputs, links inside main. Emits 'c-swipe-action' {action, id}. */
(function () {
  let drag = null;
  const w = r => r.querySelector('.c-swipe__actions').getBoundingClientRect().width + 8;
  const hide = except => document.querySelectorAll('.c-swipe.is-revealed').forEach(r => { if (r === except) return; r.classList.remove('is-revealed'); r.querySelector('.c-swipe__main').style.transform = ''; r.querySelector('.c-swipe__actions').inert = true; });
  const show = r => { hide(r); r.classList.add('is-revealed'); r.querySelector('.c-swipe__actions').inert = false; r.querySelector('.c-swipe__main').style.transform = `translateX(-${w(r)}px)`; };
  function bind(r) {
    if (r.dataset.cBound) return; r.dataset.cBound = '1';
    const m = r.querySelector('.c-swipe__main'), a = r.querySelector('.c-swipe__actions'); a.inert = true;
    m.addEventListener('pointerdown', e => { if (!e.isPrimary || e.button !== 0 || e.target.closest('[data-no-swipe], input, .c-menu')) return; drag = { r, id: e.pointerId, x: e.clientX, y: e.clientY, h: false, s: r.classList.contains('is-revealed') ? -w(r) : 0, dx: 0 }; });
    m.addEventListener('pointermove', e => { if (!drag || drag.r !== r || drag.id !== e.pointerId) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (!drag.h) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drag = null; return; } if (Math.abs(dx) < 10) return; drag.h = true; m.setPointerCapture(e.pointerId); } e.preventDefault(); drag.dx = dx; m.style.transition = 'none'; m.style.transform = `translateX(${Math.max(-w(r), Math.min(0, drag.s + dx))}px)`; }, { passive: false });
    const end = e => { if (!drag || drag.r !== r || drag.id !== e.pointerId) return; const d = drag; drag = null; m.style.transition = ''; if (d.h) { r.dataset.justSwiped = '1'; setTimeout(() => delete r.dataset.justSwiped, 400); (e.type !== 'pointercancel' && d.s + d.dx < -45) ? show(r) : hide(); } };
    m.addEventListener('pointerup', end); m.addEventListener('pointercancel', end);
    m.addEventListener('click', e => { if (r.dataset.justSwiped) { e.preventDefault(); e.stopPropagation(); } else if (r.classList.contains('is-revealed')) { e.preventDefault(); hide(); } }, true);
    m.addEventListener('keydown', e => { if (e.target.closest('input, .c-menu')) return; if (e.key === 'ArrowLeft') { e.preventDefault(); show(r); a.querySelector('button')?.focus(); } if (e.key === 'ArrowRight' || e.key === 'Escape') hide(); });
    a.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (!b) return; r.dispatchEvent(new CustomEvent('c-swipe-action', { bubbles: true, detail: { action: b.dataset.action, id: r.dataset.id } })); hide(); });
  }
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.c-swipe')) hide(); });
  window.cSwipe = { init: (s = document) => s.querySelectorAll('.c-swipe').forEach(bind), hide };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', () => window.cSwipe.init()) : window.cSwipe.init();
})();

</script>
<script>
/* c-forms-toolbar — wires a toolbar to its list. <div class="c-forms-toolbar" data-for="#listId">.
   Select/Cancel toggles data-selecting on the list + toolbar; view menu sets data-view="list|cards" on the list (emits 'c-forms-view').
   Select all syncs every .c-checkbox[data-select] in the list (checked / indeterminate). Emits 'c-forms-selection' {ids}. Needs c-menu.js. */
(function () {
  function bind(tb) {
    if (tb.dataset.cBound) return; tb.dataset.cBound = '1';
    const scope = tb.closest('[data-c-forms]') || tb.parentElement, list = (tb.dataset.for && scope.querySelector(tb.dataset.for)) || tb.nextElementSibling;   // scoped lookup: safe with duplicated ids (compare mode)
    const sel = tb.querySelector('[data-c-select]'), all = tb.querySelector('[data-c-select-all]'), vt = tb.querySelector('[data-c-view]'), vm = vt && vt.nextElementSibling;
    const boxes = () => [...list.querySelectorAll('.c-checkbox[data-select]:not(:disabled)')];
    const sync = () => { const b = boxes(), n = b.filter(x => x.checked).length; if (all) { all.checked = b.length && n === b.length; all.indeterminate = n > 0 && n < b.length; } scope.dispatchEvent(new CustomEvent('c-forms-selection', { bubbles: true, detail: { ids: b.filter(x => x.checked).map(x => x.dataset.select) } })); };
    sel && sel.addEventListener('click', () => { const on = scope.dataset.selecting !== 'true'; scope.dataset.selecting = on; sel.textContent = on ? 'Cancel' : 'Select'; sel.setAttribute('aria-pressed', on); if (!on) { boxes().forEach(b => b.checked = false); } sync(); });
    all && all.addEventListener('change', () => { boxes().forEach(b => b.checked = all.checked); sync(); });
    list.addEventListener('change', e => { if (e.target.matches('.c-checkbox[data-select]')) sync(); });
    if (vt && vm) { window.cMenu.attach(vt, vm, { align: 'start' }); vm.addEventListener('click', e => { const it = e.target.closest('[data-value]'); if (!it) return; scope.dataset.view = it.dataset.value; vm.querySelectorAll('[aria-checked]').forEach(x => x.setAttribute('aria-checked', x === it)); vt.firstChild.textContent = it.dataset.value === 'list' ? 'List' : 'Cards'; scope.dispatchEvent(new CustomEvent('c-forms-view', { bubbles: true, detail: { view: it.dataset.value } })); }); }
  }
  window.cFormsToolbar = { init: (s = document) => s.querySelectorAll('.c-forms-toolbar').forEach(bind) };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', () => window.cFormsToolbar.init()) : window.cFormsToolbar.init();
})();

</script>
<script>document.querySelectorAll('[data-c-menu-trigger]').forEach(t=>cMenu.attach(t,t.nextElementSibling,{align:'end'}));document.querySelectorAll('[data-indet]').forEach(c=>c.indeterminate=true);</script>
