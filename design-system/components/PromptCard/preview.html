heir client profiles.</span></button><button type="button" class="c-prompt-card c-prompt-card--plan"><span class="c-prompt-card__top"><i class="ph ph-megaphone-simple c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Start a campaign</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Add all my new buyer leads to a buyer nurture campaign.</span></button><button type="button" class="c-prompt-card c-prompt-card--plan"><span class="c-prompt-card__top"><i class="ph ph-calendar-check c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Schedule a follow-up</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Remind me to follow up with Lisa next Tuesday.</span></button><button type="button" class="c-prompt-card c-prompt-card--insight"><span class="c-prompt-card__top"><i class="ph ph-fire c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Find hot buyers</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Show me my hottest buyers and who I should contact today.</span></button><button type="button" class="c-prompt-card c-prompt-card--more"><span class="c-prompt-card__title t-body-strong">More examples</span><i class="ph ph-caret-down c-prompt-card__go" aria-hidden="true"></i></button></div></div><div class="cell" data-theme="dark"><p class="lab t-caption">Dark · quiet</p><div class="msg"><span class="mel mel--inline" data-state="idle"></span><p class="t-body">Here’s what you can ask me to do.</p></div><div class="c-prompt-cards"><button type="button" class="c-prompt-card c-prompt-card--reach"><span class="c-prompt-card__top"><i class="ph ph-chat-circle c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Send a text</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Send a text to Sarah Johnson asking if she’s still interested in buying a home.</span></button><button type="button" class="c-prompt-card c-prompt-card--reach"><span class="c-prompt-card__top"><i class="ph ph-envelope-simple c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Send an email</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Draft a follow-up email to Michael about the homes we discussed.</span></button><button type="button" class="c-prompt-card c-prompt-card--clients"><span class="c-prompt-card__top"><i class="ph ph-arrows-left-right c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Update client status</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Change David Miller’s status to Active Buyer.</span></button><button type="button" class="c-prompt-card c-prompt-card--clients"><span class="c-prompt-card__top"><i class="ph ph-users c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Add family members</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Add Jennifer as Robert’s spouse and link their client profiles.</span></button><button type="button" class="c-prompt-card c-prompt-card--plan"><span class="c-prompt-card__top"><i class="ph ph-megaphone-simple c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Start a campaign</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Add all my new buyer leads to a buyer nurture campaign.</span></button><button type="button" class="c-prompt-card c-prompt-card--plan"><span class="c-prompt-card__top"><i class="ph ph-calendar-check c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Schedule a follow-up</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Remind me to follow up with Lisa next Tuesday.</span></button><button type="button" class="c-prompt-card c-prompt-card--insight"><span class="c-prompt-card__top"><i class="ph ph-fire c-prompt-card__icon" aria-hidden="true"></i><span class="c-prompt-card__title t-body-strong">Find hot buyers</span><i class="ph ph-arrow-up-right c-prompt-card__go" aria-hidden="true"></i></span><span class="c-prompt-card__prompt t-meta">Show me my hottest buyers and who I should contact today.</span></button><button type="button" class="c-prompt-card c-prompt-card--more"><span class="c-prompt-card__title t-body-strong">More examples</span><i class="ph ph-caret-down c-prompt-card__go" aria-hidden="true"></i></button></div></div></div>
<script>/* Radius Mobile harness. Include LAST on any prototype page:
   <script src="<path>/harness/harness.js"><\/script>
   - URL params: ?theme=dark|light  &exp=quiet|accented|colorful  &platform=ios|android  &ts=1|1.2|1.5  &compare=1
   - compare=1 renders the device twice: dark + light, side by side (use for self-review screenshots).
   - Fills every empty <span class="mel" data-state="..."> with the correct Mel body + face. Never hand-write Mel SVG. */
(function () {
  const q = new URLSearchParams(location.search);
  const html = document.documentElement;
  const set = (k, v) => v && (html.dataset[k] = v);
  set('theme', q.get('theme')); set('expression', q.get('exp')); set('platform', q.get('platform'));
  if (q.get('ts')) html.style.setProperty('--type-scale', q.get('ts'));

  const FACE = '<span class="mel__body"><svg class="mel__eyes" viewBox="0 0 17 8" aria-hidden="true"><path class="mel__eye" d="M0 8V3a3 3 0 0 1 6 0v5Z"/><path class="mel__eye" d="M11 8V3a3 3 0 0 1 6 0v5Z"/></svg><svg class="mel__smile" viewBox="0 0 17 6.5" aria-hidden="true"><path d="M0 6V3a3 3 0 0 1 6 0v3H4.6V3a1.6 1.6 0 0 0-3.2 0v3Z"/><path d="M11 6V3a3 3 0 0 1 6 0v3h-1.4V3a1.6 1.6 0 0 0-3.2 0v3Z"/></svg></span>';
  const fillMel = root => root.querySelectorAll('.mel').forEach(m => {
    if (!m.querySelector('.mel__body')) m.innerHTML = FACE;
    if (!m.hasAttribute('role')) { m.setAttribute('role', 'img'); m.setAttribute('aria-label', 'MEL, ' + (m.dataset.state || 'idle')); }
    if (!m.dataset.state) m.dataset.state = 'idle';
  });
  fillMel(document);

  // compare mode: clone first device into a light/dark pair
  const dev = document.querySelector('.rm-device');
  if (q.get('compare') && dev) {
    const stage = dev.closest('.rm-stage') || dev.parentElement;
    const mk = (theme, node) => { const c = document.createElement('div'); c.className = 'rm-stage__col'; c.dataset.theme = theme; c.innerHTML = `<p class="t-caption t-secondary">${theme}</p>`; c.appendChild(node); return c; };
    const clone = dev.cloneNode(true);
    stage.innerHTML = ''; stage.appendChild(mk('dark', dev)); stage.appendChild(mk('light', clone));
  }

  // control bar
  if (q.get('bar') !== '0' && document.body.classList.contains('rm-harness')) {
    const bar = document.createElement('div'); bar.className = 'rm-harness-bar'; bar.setAttribute('aria-label', 'Harness controls');
    const sel = (name, opts, cur) => `<select data-k="${name}" aria-label="${name}">${opts.map(o => `<option ${o == cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    bar.innerHTML = sel('theme', ['dark', 'light'], q.get('theme') || html.dataset.theme || 'light') + sel('exp', ['quiet', 'accented', 'colorful'], q.get('exp') || 'quiet') + sel('platform', ['ios', 'android'], q.get('platform') || 'ios') + sel('ts', ['1', '1.2', '1.5'], q.get('ts') || '1') + `<button data-compare>${q.get('compare') ? 'single' : 'compare'}</button>`;
    bar.addEventListener('change', e => { q.set(e.target.dataset.k, e.target.value); location.search = q; });
    bar.querySelector('[data-compare]').onclick = () => { q.get('compare') ? q.delete('compare') : q.set('compare', '1'); location.search = q; };
    document.body.appendChild(bar);
  }
})();
</script>
</body></html>
