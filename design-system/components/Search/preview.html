<script>
const t = document.getElementById('specimen').innerHTML;
const cells = [];
for (const theme of ['light', 'dark']) for (const exp of ['quiet'])
  cells.push(`<div data-theme="${theme}" data-expression="${exp}"><p class="t-caption t-tertiary" style="margin-bottom:var(--space-3)">${theme} · ${exp}</p>${t}</div>`);
document.getElementById('mx').innerHTML = cells.join('');
</script>
<script>
/* c-search — shows clear button when there is text; clear empties + refocuses; Esc clears. Emits 'c-search' {query} on input. */
(function () {
  function bind(s) { if (s.dataset.cBound) return; s.dataset.cBound = '1'; const i = s.querySelector('input'), c = s.querySelector('.c-search__clear'); const sync = () => { c.hidden = !i.value; s.dispatchEvent(new CustomEvent('c-search', { bubbles: true, detail: { query: i.value } })); }; i.addEventListener('input', sync); i.addEventListener('keydown', e => { if (e.key === 'Escape' && i.value) { i.value = ''; sync(); } }); c.addEventListener('click', () => { i.value = ''; sync(); i.focus(); }); c.hidden = !i.value; }
  window.cSearch = { init: (s = document) => s.querySelectorAll('.c-search').forEach(bind) };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', () => window.cSearch.init()) : window.cSearch.init();
})();

</script>
