<!-- @dsCard group="Cards and summaries" height=940 subtitle="c-story-card: morning brief and task summary scenes (sample content, placeholder photo)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
body{margin:0;background:var(--bg-page);}
.mx{display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);position:relative;color:var(--text-primary);min-width:0}
.mx>.cell>.lab{font-size:12px;margin:0 0 12px;color:var(--text-secondary)}
</style></head>
<body class="rm-root">
<div class="mx"><div class="cell" data-theme="light"><p class="lab t-caption">Light · quiet</p><div class="rm-stack" data-sc="morning"></div><div class="rm-stack" style="margin-top:24px" data-sc="night"></div></div><div class="cell" data-theme="dark"><p class="lab t-caption">Dark · quiet</p><div class="rm-stack" data-sc="morning"></div><div class="rm-stack" style="margin-top:24px" data-sc="night"></div></div></div>
<script>/* Radius Mobile harness. Include LAST on any prototype page:
   <script src="<path>/harness/harness.js"><\/script>
   - URL params: ?theme=dark|light  &exp=quiet|accented|colorful  &platform=ios|android  &ts=1|1.2|1.5  &compare=1
   - compare=1 renders the device twice: dark + light, side by side (use for self-review screenshots).
   - Fills every empty <span class="mel" data-state="..."> with the correct Mel body + face. Never hand-write Mel SVG. */
(function () {
  const q = new URLSearchParams(location.search);
  const html = document.documentElement;
  const set = (k, v) => v && (html.dataset[k] = v);
  set('theme', q.get('theme')); set('expression', q.get('exp')); set('platform', q.get('platform'));
  if (q.get('ts')) html.style.setProperty('--type-scale', q.get('ts'));

  const FACE = '<span class="mel__body"><svg class="mel__eyes" viewBox="0 0 17 8" aria-hidden="true"><path class="mel__eye" d="M0 8V3a3 3 0 0 1 6 0v5Z"/><path class="mel__eye" d="M11 8V3a3 3 0 0 1 6 0v5Z"/></svg><svg class="mel__smile" viewBox="0 0 17 6.5" aria-hidden="true"><path d="M0 6V3a3 3 0 0 1 6 0v3H4.6V3a1.6 1.6 0 0 0-3.2 0v3Z"/><path d="M11 6V3a3 3 0 0 1 6 0v3h-1.4V3a1.6 1.6 0 0 0-3.2 0v3Z"/></svg></span>';
  const fillMel = root => root.querySelectorAll('.mel').forEach(m => {
    if (!m.querySelector('.mel__body')) m.innerHTML = FACE;
    if (!m.hasAttribute('role')) { m.setAttribute('role', 'img'); m.setAttribute('aria-label', 'MEL, ' + (m.dataset.state || 'idle')); }
    if (!m.dataset.state) m.dataset.state = 'idle';
  });
  fillMel(document);

  // compare mode: clone first device into a light/dark pair
  const dev = document.querySelector('.rm-device');
  if (q.get('compare') && dev) {
    const stage = dev.closest('.rm-stage') || dev.parentElement;
    const mk = (theme, node) => { const c = document.createElement('div'); c.className = 'rm-stage__col'; c.dataset.theme = theme; c.innerHTML = `<p class="t-caption t-secondary">${theme}</p>`; c.appendChild(node); return c; };
    const clone = dev.cloneNode(true);
    stage.innerHTML = ''; stage.appendChild(mk('dark', dev)); stage.appendChild(mk('light', clone));
  }

  // control bar
  if (q.get('bar') !== '0' && document.body.classList.contains('rm-harness')) {
    const bar = document.createElement('div'); bar.className = 'rm-harness-bar'; bar.setAttribute('aria-label', 'Harness controls');
    const sel = (name, opts, cur) => `<select data-k="${name}" aria-label="${name}">${opts.map(o => `<option ${o == cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    bar.innerHTML = sel('theme', ['dark', 'light'], q.get('theme') || html.dataset.theme || 'light') + sel('exp', ['quiet', 'accented', 'colorful'], q.get('exp') || 'quiet') + sel('platform', ['ios', 'android'], q.get('platform') || 'ios') + sel('ts', ['1', '1.2', '1.5'], q.get('ts') || '1') + `<button data-compare>${q.get('compare') ? 'single' : 'compare'}</button>`;
    bar.addEventListener('change', e => { q.set(e.target.dataset.k, e.target.value); location.search = q; });
    bar.querySelector('[data-compare]').onclick = () => { q.get('compare') ? q.delete('compare') : q.set('compare', '1'); location.search = q; };
    document.body.appendChild(bar);
  }
})();
</script>
<script type="module">
/* Sample narrative illustrations, never executable tasks or real property data. */
export function renderStoryCard(scene,{photo='/assets/welcome/property-sample.jpg',decorative=false}={}){
 const image=`<div class="c-story-card__photo"><img src="${photo}" alt="${decorative?'':'Sample two-story home with a driveway and front garden'}" width="256" height="256"><span class="c-story-card__sample rm-chip t-chip">Sample</span></div>`;
 if(decorative)return `<div class="c-story-card">${image}</div>`;
 const row=(title,detail)=>`<div class="rm-item"><div class="rm-item__body rm-stack rm-stack--tight"><p class="t-row-title">${title}</p><p class="t-meta t-secondary">${detail}</p></div></div>`;
 if(scene.time==='morning')return `<article class="c-story-card">${image}<div class="rm-card c-story-card__content"><div class="rm-row rm-row--between"><h2 class="t-row-title">Your day, prepared</h2><span class="t-caption t-secondary">MEL brief</span></div>${row('10:00 · Listing appointment','128 Oak Street · Meet Maya')}<p class="c-story-card__brief t-meta t-secondary">MEL gathered the property details and your seller’s priorities.</p><div class="c-story-card__status rm-row"><span class="rm-chip t-chip tone-mel">Brief prepared</span><span class="t-caption t-secondary">Follow-up at 14:00</span></div></div></article>`;
 if(scene.time==='evening')return `<article class="c-story-card">${image}<div class="rm-card c-story-card__content"><div class="rm-row rm-row--between"><h2 class="t-row-title">Your listing, marketed</h2><span class="t-caption t-secondary">MEL drafted this</span></div>${row('Just listed · 128 Oak Street','A bright new chapter starts here.')}<p class="c-story-card__brief t-meta t-secondary">Explore this welcoming home with room to make it your own. Message us for a tour.</p><div class="c-story-card__status"><span class="rm-chip t-chip tone-mel">Awaiting your approval</span></div></div></article>`;
 return `<article class="c-story-card c-story-card--summary"><div class="rm-card c-story-card__content"><div class="c-story-card__lead"><img class="c-story-card__thumbnail" src="${photo}" alt="Sample home" width="256" height="256"><div class="rm-stack rm-stack--tight"><span class="t-caption t-secondary">Sample · 128 Oak Street</span><h2 class="t-row-title">Your work, organized</h2></div></div>${row('Client follow-up prepared','Maya’s listing brief is ready')}${row('Tomorrow · 09:30 showing','Property details gathered')}${row('Listing post drafted','One item needs your approval')}<div class="c-story-card__status"><span class="rm-chip t-chip tone-mel">Ready for your review</span></div></div></article>`;
}

const PH="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><rect width='256' height='256' fill='%23e2f5ea'/></svg>";document.querySelectorAll("[data-sc]").forEach(h=>{h.innerHTML=renderStoryCard({time:h.dataset.sc},{photo:PH});});
</script>
</body></html>
