<!-- @dsCard group="Lists and rows" height=560 subtitle="c-tx-card-row: static rendition of the review page (light and dark, quiet)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
  /* Matrix chrome only */
  .mx { display: grid; grid-template-columns: repeat(2, minmax(0, 380px)); gap: var(--space-6); justify-content: center; }
  .mx > div { background: var(--bg-page); border-radius: var(--radius-sheet); padding: var(--space-4); position: relative; }
</style>
<style>body{margin:0;background:var(--bg-page);}</style></head>
<body class="rm-root">
<!-- REVIEW MATRIX: c-tx-card-row × dark/light × quiet/accented/colorful. -->
<div class="mx" id="mx"></div>
<template id="specimen">
<div class="rm-stack">
  <div class="rm-section-head"><h2 class="t-section">Active transactions</h2></div>
  <div class="rm-card rm-card--list">
    <button type="button" class="c-tx-card-row" aria-label="118 Maple St, Fremont, CA. Buyer. In escrow, close Sep 12">
      <span class="c-tx-card-row__head"><img class="c-tx-card-row__photo" src="../_assets/transactions/118-maple-st.jpg" alt="" onerror="this.outerHTML='<span class=&quot;c-tx-card-row__photo&quot;><i class=&quot;ph ph-house-line&quot;></i></span>'">
        <span class="c-tx-card-row__body"><span><span class="c-tx-card-row__address t-address">118 Maple St, Fremont, CA</span><span class="c-tx-card-row__price t-money-sm">$1,150,000<i class="c-tx-card-row__sep"></i><span class="c-tx-card-row__role role-buyer t-meta">Buyer</span></span></span><i class="ph ph-caret-right c-tx-card-row__chev" aria-hidden="true"></i></span></span>
      <span class="c-tx-card-row__foot"><span class="c-tx-card-row__status tone-info t-chip"><span class="c-tx-card-row__dot"></span>In escrow</span><span class="t-caption t-secondary">Close Sep 12</span></span>
    </button>
    <button type="button" class="c-tx-card-row" aria-label="42 Oak Ln, Fremont, CA. Seller. Inspection due">
      <span class="c-tx-card-row__head"><img class="c-tx-card-row__photo" src="../_assets/transactions/42-oak-ln.jpg" alt="" onerror="this.outerHTML='<span class=&quot;c-tx-card-row__photo&quot;><i class=&quot;ph ph-house-line&quot;></i></span>'">
        <span class="c-tx-card-row__body"><span><span class="c-tx-card-row__address t-address">42 Oak Ln, Fremont, CA</span><span class="c-tx-card-row__price t-money-sm">$980,000<i class="c-tx-card-row__sep"></i><span class="c-tx-card-row__role role-seller t-meta">Seller</span></span></span><i class="ph ph-caret-right c-tx-card-row__chev" aria-hidden="true"></i></span></span>
      <span class="c-tx-card-row__foot"><span class="c-tx-card-row__status tone-warning t-chip"><span class="c-tx-card-row__dot"></span>Inspection due</span><span class="t-caption t-secondary">Offer review</span></span>
    </button>
  </div>
</div>
</template>

<script>
const t = document.getElementById('specimen').innerHTML;
const cells = [];
for (const theme of ['light', 'dark']) for (const exp of ['quiet'])
  cells.push(`<div data-theme="${theme}" data-expression="${exp}"><p class="t-caption t-tertiary" style="margin-bottom:var(--space-3)">${theme} · ${exp}</p>${t}</div>`);
document.getElementById('mx').innerHTML = cells.join('');
</script>


</body></html>
