<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>InsetSheet · Radius Mobile</title><style>@font-face{font-family:"Mona Sans";src:url(../fonts/MonaSans-VF.woff2) format("woff2");font-weight:200 900}</style><link rel="stylesheet" href="../components/bundle.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">


<style>body{margin:0;background:var(--bg-page);}</style></head>
<body class="rm-root"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:var(--space-6);justify-content:center;padding:var(--space-4)"><div data-theme="light" data-expression="quiet" style="position:relative;height:300px;background:var(--bg-page);border-radius:var(--radius-sheet);overflow:hidden"><section class="rm-sheet c-inset-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="c-inset-sheet__grab-wrap"><div class="rm-sheet__grab"></div></div>
  <header class="c-inset-sheet__head">
    <div class="c-inset-sheet__head-copy">
      <h2 id="sheet-title" class="t-sheet-title">Sheet title</h2>
      <span class="c-inset-sheet__subtitle t-caption">Supporting text</span>
    </div>
    <button type="button" class="rm-btn rm-btn--glass" aria-label="Close"><i class="ph ph-x"></i></button>
  </header>
  <div class="c-inset-sheet__body">Scrollable content</div>
</section></div><div data-theme="dark" data-expression="quiet" style="position:relative;height:300px;background:var(--bg-page);border-radius:var(--radius-sheet);overflow:hidden"><section class="rm-sheet c-inset-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="c-inset-sheet__grab-wrap"><div class="rm-sheet__grab"></div></div>
  <header class="c-inset-sheet__head">
    <div class="c-inset-sheet__head-copy">
      <h2 id="sheet-title" class="t-sheet-title">Sheet title</h2>
      <span class="c-inset-sheet__subtitle t-caption">Supporting text</span>
    </div>
    <button type="button" class="rm-btn rm-btn--glass" aria-label="Close"><i class="ph ph-x"></i></button>
  </header>
  <div class="c-inset-sheet__body">Scrollable content</div>
</section></div></div></body></html>
