<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Radio · Radius Mobile</title><style>@font-face{font-family:"Mona Sans";src:url(../fonts/MonaSans-VF.woff2) format("woff2");font-weight:200 900}</style><link rel="stylesheet" href="../components/bundle.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0}.lab{margin:var(--space-4) 0 var(--space-2);color:var(--text-secondary)}.lab:first-child{margin-top:0}</style></head><body class="rm-root"><div class="mx"><div class="cell" data-theme="light"><p class="lab t-caption" id="r1a">Light · Duplicates</p><div class="rm-card c-radio-group" role="radiogroup" aria-labelledby="r1a"><label class="c-radio"><input type="radio" name="ga" value="s" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Skip</span><span class="c-radio__text t-meta">Keep the contact in Radius as is</span></span></label><label class="c-radio"><input type="radio" name="ga" value="u" class="c-radio__input" checked><span class="c-radio__body"><span class="c-radio__title t-body-strong">Update existing</span><span class="c-radio__text t-meta">Add new details from the file</span></span></label><label class="c-radio"><input type="radio" name="ga" value="b" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Keep both</span><span class="c-radio__text t-meta">Create a second contact</span></span></label></div><p class="lab t-caption" id="r2a">Billing, with a disabled option</p><div class="rm-card c-radio-group" role="radiogroup" aria-labelledby="r2a"><label class="c-radio"><input type="radio" name="ha" value="m" class="c-radio__input" checked><span class="c-radio__body"><span class="c-radio__title t-body-strong">Monthly</span><span class="c-radio__text t-meta">Billed every month</span></span></label><label class="c-radio"><input type="radio" name="ha" value="y" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Yearly</span><span class="c-radio__text t-meta">Billed once a year, two months free</span></span></label><label class="c-radio"><input type="radio" name="ha" value="t" class="c-radio__input" disabled><span class="c-radio__body"><span class="c-radio__title t-body-strong">Team plan</span><span class="c-radio__text t-meta">Not available on this account</span></span></label></div></div><div class="cell" data-theme="dark"><p class="lab t-caption" id="r1b">Dark · Duplicates</p><div class="rm-card c-radio-group" role="radiogroup" aria-labelledby="r1b"><label class="c-radio"><input type="radio" name="gb" value="s" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Skip</span><span class="c-radio__text t-meta">Keep the contact in Radius as is</span></span></label><label class="c-radio"><input type="radio" name="gb" value="u" class="c-radio__input" checked><span class="c-radio__body"><span class="c-radio__title t-body-strong">Update existing</span><span class="c-radio__text t-meta">Add new details from the file</span></span></label><label class="c-radio"><input type="radio" name="gb" value="b" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Keep both</span><span class="c-radio__text t-meta">Create a second contact</span></span></label></div><p class="lab t-caption" id="r2b">Billing, with a disabled option</p><div class="rm-card c-radio-group" role="radiogroup" aria-labelledby="r2b"><label class="c-radio"><input type="radio" name="hb" value="m" class="c-radio__input" checked><span class="c-radio__body"><span class="c-radio__title t-body-strong">Monthly</span><span class="c-radio__text t-meta">Billed every month</span></span></label><label class="c-radio"><input type="radio" name="hb" value="y" class="c-radio__input"><span class="c-radio__body"><span class="c-radio__title t-body-strong">Yearly</span><span class="c-radio__text t-meta">Billed once a year, two months free</span></span></label><label class="c-radio"><input type="radio" name="hb" value="t" class="c-radio__input" disabled><span class="c-radio__body"><span class="c-radio__title t-body-strong">Team plan</span><span class="c-radio__text t-meta">Not available on this account</span></span></label></div></div></div></body></html>
