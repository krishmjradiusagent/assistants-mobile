<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>StreamingText · Radius Mobile</title><style>@font-face{font-family:"Mona Sans";src:url(../fonts/MonaSans-VF.woff2) format("woff2");font-weight:200 900}</style><link rel="stylesheet" href="../components/bundle.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
body{margin:0;background:var(--bg-page);}
.mx{display:grid;grid-template-columns:repeat(2,minmax(0,380px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);position:relative;color:var(--text-primary);min-width:0}
.mx>.cell>.lab{font-size:12px;margin:0 0 12px;color:var(--text-secondary)}
</style></head>
<body class="rm-root">
<div class="mx"><div class="cell" data-theme="light"><p class="lab t-caption">Light · quiet</p><div data-st></div></div><div class="cell" data-theme="dark"><p class="lab t-caption">Dark · quiet</p><div data-st></div></div></div>
<script>/* Radius Mobile harness. Include LAST on any prototype page:
   <script src="<path>/harness/harness.js"><\/script>
   - URL params: ?theme=dark|light  &exp=quiet|accented|colorful  &platform=ios|android  &ts=1|1.2|1.5  &compare=1
   - compare=1 renders the device twice: dark + light, side by side (use for self-review screenshots).
   - Fills every empty <span class="mel" data-state="..."> with the correct Mel body + face. Never hand-write Mel SVG. */
(function () {
  const q = new URLSearchParams(location.search);
  const html = document.documentElement;
  const set = (k, v) => v && (html.dataset[k] = v);
  set('theme', q.get('theme')); set('expression', q.get('exp')); set('platform', q.get('platform'));
  if (q.get('ts')) html.style.setProperty('--type-scale', q.get('ts'));

  const FACE = '<span class="mel__body"><svg class="mel__eyes" viewBox="0 0 17 8" aria-hidden="true"><path class="mel__eye" d="M0 8V3a3 3 0 0 1 6 0v5Z"/><path class="mel__eye" d="M11 8V3a3 3 0 0 1 6 0v5Z"/></svg><svg class="mel__smile" viewBox="0 0 17 6.5" aria-hidden="true"><path d="M0 6V3a3 3 0 0 1 6 0v3H4.6V3a1.6 1.6 0 0 0-3.2 0v3Z"/><path d="M11 6V3a3 3 0 0 1 6 0v3h-1.4V3a1.6 1.6 0 0 0-3.2 0v3Z"/></svg></span>';
  const fillMel = root => root.querySelectorAll('.mel').forEach(m => {
    if (!m.querySelector('.mel__body')) m.innerHTML = FACE;
    if (!m.hasAttribute('role')) { m.setAttribute('role', 'img'); m.setAttribute('aria-label', 'MEL, ' + (m.dataset.state || 'idle')); }
    if (!m.dataset.state) m.dataset.state = 'idle';
  });
  fillMel(document);

  // compare mode: clone first device into a light/dark pair
  const dev = document.querySelector('.rm-device');
  if (q.get('compare') && dev) {
    const stage = dev.closest('.rm-stage') || dev.parentElement;
    const mk = (theme, node) => { const c = document.createElement('div'); c.className = 'rm-stage__col'; c.dataset.theme = theme; c.innerHTML = `<p class="t-caption t-secondary">${theme}</p>`; c.appendChild(node); return c; };
    const clone = dev.cloneNode(true);
    stage.innerHTML = ''; stage.appendChild(mk('dark', dev)); stage.appendChild(mk('light', clone));
  }

  // control bar
  if (q.get('bar') !== '0' && document.body.classList.contains('rm-harness')) {
    const bar = document.createElement('div'); bar.className = 'rm-harness-bar'; bar.setAttribute('aria-label', 'Harness controls');
    const sel = (name, opts, cur) => `<select data-k="${name}" aria-label="${name}">${opts.map(o => `<option ${o == cur ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    bar.innerHTML = sel('theme', ['dark', 'light'], q.get('theme') || html.dataset.theme || 'light') + sel('exp', ['quiet', 'accented', 'colorful'], q.get('exp') || 'quiet') + sel('platform', ['ios', 'android'], q.get('platform') || 'ios') + sel('ts', ['1', '1.2', '1.5'], q.get('ts') || '1') + `<button data-compare>${q.get('compare') ? 'single' : 'compare'}</button>`;
    bar.addEventListener('change', e => { q.set(e.target.dataset.k, e.target.value); location.search = q; });
    bar.querySelector('[data-compare]').onclick = () => { q.get('compare') ? q.delete('compare') : q.set('compare', '1'); location.search = q; };
    document.body.appendChild(bar);
  }
})();
</script>
<script type="module">
// Vanilla DOM composition. WORD_MS matches the user-supplied StreamingText contract.
export const WORD_MS = 55;
let sequence = 0;
const safeUrl = value => {
  try { const url = new URL(value); return /^https?:$/.test(url.protocol) ? url.href : null; }
  catch { return null; }
};
export function mountStreamingText(host, options = {}) {
  const doc = host.ownerDocument;
  const make = (tag, className, text) => {
    const node = doc.createElement(tag);
    node.className = className;
    if (text != null) node.textContent = String(text);
    return node;
  };
  const root = make('div', 'c-streaming-text');
  const body = make('div', 'c-streaming-text__body t-body');
  const status = make('span', 'c-streaming-text__sr');
  status.setAttribute('role', 'status');
  const footer = make('div', 'c-streaming-text__footer');
  footer.hidden = true;
  const actions = make('div', 'c-streaming-text__actions');
  const suppliedSources = options.sources || [];
  const sources = suppliedSources.filter(source => source && source.name);
  // Supplied source accepts individual word tokens and cite:true placeholders.
  // Paragraph chunks with numeric source indices preserve their exact whitespace.
  const tokenInput = Boolean(options.content?.some(part => typeof part.cite === 'boolean') || options.content?.every(part => !/\s/.test(part.text || '')));
  const content = (options.content || [{text: options.text || ''}]).map(part => ({...part, text: part.cite === true ? '' : String(part.text || '') + (tokenInput && !part.cite && part.text && !/\s$/.test(part.text) ? ' ' : '')}));
  const text = content.map(part => String(part.text || '')).join('');
  const tokens = [];
  for (const part of content) {
    const words = String(part.text || '').match(/\S+\s*|\s+/gu) || [];
    words.forEach(word => tokens.push({text:word}));
    if (part.cite != null) {
      // Source cite:true selects the first source; numeric indices are an extension.
      const index = part.cite === true ? 0 : part.cite;
      const source = suppliedSources[index];
      if (part.cite !== false && source && safeUrl(source.href)) tokens.push({source,index});
    }
  }
  let timer = null, destroyed = false, complete = false, cursor = 0;
  let callbacks = options;
  const caret = make('span', 'c-streaming-text__caret', '▍');
  caret.setAttribute('aria-hidden', 'true');
  const button = (label, callback) => {
    const node = make('button', 'rm-btn rm-btn--ghost rm-btn--sm t-meta', label);
    node.type = 'button';
    node.addEventListener('click', callback);
    return node;
  };
  const copy = button('Copy', () => callbacks.onCopy?.(text));
  const retry = button('Retry', () => callbacks.onRetry?.());
  const like = button('Like', () => callbacks.onFeedback?.(like.getAttribute('aria-pressed') === 'true' ? null : 'like'));
  const dislike = button('Dislike', () => callbacks.onFeedback?.(dislike.getAttribute('aria-pressed') === 'true' ? null : 'dislike'));
  like.setAttribute('aria-label', 'Like answer (local demo feedback)');
  dislike.setAttribute('aria-label', 'Dislike answer (local demo feedback)');
  actions.append(copy, retry, like, dislike);
  footer.append(actions, make('p', 't-caption t-secondary', 'Feedback stays in this demo.'));
  if (sources.length) {
    const id = 'mel-answer-sources-' + ++sequence;
    const toggle = button(sources.length + (sources.length === 1 ? ' source' : ' sources'), () => {
      const expanded = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(expanded));
      panel.classList.toggle('is-expanded', expanded);
      panel.setAttribute('aria-hidden', String(!expanded));
      panel.toggleAttribute('inert', !expanded);
      panel.inert = !expanded;
      panel.querySelectorAll('a').forEach(link => link.tabIndex = expanded ? 0 : -1);
      callbacks.onProgress?.();
    });
    toggle.setAttribute('aria-controls', id);
    toggle.setAttribute('aria-expanded', 'false');
    const panel = make('div', 'c-streaming-text__sources');
    panel.id = id;
    panel.addEventListener('transitionend', () => callbacks.onProgress?.());
    panel.setAttribute('aria-hidden', 'true');
    panel.setAttribute('inert', '');
    panel.inert = true;
    const inner = make('div', 'c-streaming-text__sources-inner');
    inner.append(make('p', 't-caption t-secondary', 'Demo source previews · No live search performed'));
    for (const source of sources) {
      const url = safeUrl(source.href);
      const item = make(url ? 'a' : 'span', 'rm-item');
      const details = make('span', 'rm-item__body');
      details.append(make('span', 't-meta', source.name), make('span', 't-caption t-secondary', source.domain || ''));
      item.append(details);
      if (url) { item.href = url; item.target = '_blank'; item.rel = 'noopener noreferrer'; item.tabIndex = -1; }
      inner.append(item);
    }
    panel.append(inner);
    footer.append(toggle, panel);
  }
  const followUps = make('div', 'c-streaming-text__follow-ups');
  (options.followUps || []).forEach((text, index) => {
    const item = button(text, () => callbacks.onFollowUp?.(text, index));
    item.style.setProperty('--c-follow-up-delay', index * 90 + 'ms');
    followUps.append(item);
  });
  footer.append(followUps);
  root.append(body, status, footer);
  host.append(root);
  const media = doc.defaultView?.matchMedia?.('(prefers-reduced-motion: reduce)');
  function appendToken(token) {
    if (token.source) {
      const link = make('a', 'rm-chip t-caption c-streaming-text__citation', token.source.domain || token.source.name);
      link.href = safeUrl(token.source.href);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.setAttribute('aria-label', 'Source: ' + token.source.name);
      // Keep all controls outside the keyboard order until the answer is complete.
      link.tabIndex = -1;
      body.insertBefore(link, caret);
    } else body.insertBefore(doc.createTextNode(token.text), caret);
  }
  function finish(notify) {
    if (destroyed || complete) return;
    clearTimeout(timer);
    while (cursor < tokens.length) appendToken(tokens[cursor++]);
    complete = true;
    caret.remove();
    body.removeAttribute('aria-hidden');
    root.dataset.state = 'complete';
    body.querySelectorAll('a').forEach(link => link.tabIndex = 0);
    footer.hidden = false;
    // The surrounding log has live announcements off; announce the final text once.
    status.textContent = notify ? text : '';
    callbacks.onProgress?.();
    if (notify) callbacks.onDone?.();
  }
  function tick() {
    if (destroyed || complete) return;
    appendToken(tokens[cursor++]);
    callbacks.onProgress?.();
    if (cursor >= tokens.length) finish(true);
    else timer = setTimeout(tick, WORD_MS);
  }
  function motionChanged(event) { if (event.matches) finish(true); }
  function update(next) {
    callbacks = {...callbacks, ...next};
    like.setAttribute('aria-pressed', String(callbacks.feedback === 'like'));
    dislike.setAttribute('aria-pressed', String(callbacks.feedback === 'dislike'));
    retry.disabled = !callbacks.onRetry || Boolean(callbacks.busy);
    copy.disabled = !callbacks.onCopy;
    followUps.querySelectorAll('button').forEach(node => node.disabled = !callbacks.onFollowUp || Boolean(callbacks.busy));
  }
  update(options);
  body.append(caret);
  media?.addEventListener?.('change', motionChanged);
  if (!options.stream) finish(false);
  else {
    root.dataset.state = 'streaming';
    body.setAttribute('aria-hidden', 'true');
    status.textContent = 'MEL is composing a response.';
    if (media?.matches || !tokens.length) finish(true);
    else timer = setTimeout(tick, WORD_MS);
  }
  return {
    update,
    destroy() {
      if (destroyed) return;
      destroyed = true;
      clearTimeout(timer);
      media?.removeEventListener?.('change', motionChanged);
      root.remove();
    }
  };
}

document.querySelectorAll("[data-st]").forEach(h=>mountStreamingText(h,{"text": "Your closing is on track. The inspection report is in, and the lender needs one more signed form before Friday.", "stream": false, "followUps": ["Show the missing form", "Send a reminder to the lender"], "sources": [{"name": "Transaction timeline", "domain": "radius.app", "href": "#"}]}));
</script>
</body></html>
