<!DOCTYPE html><html lang="en"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>VoiceSheet · Radius Mobile</title><style>@font-face{font-family:"Mona Sans";src:url(../fonts/MonaSans-VF.woff2) format("woff2");font-weight:200 900}</style><link rel="stylesheet" href="../components/bundle.css"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;background:var(--bg-page)}.mx{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:var(--space-6);justify-content:center;padding:var(--space-4)}
.mx>.cell{position:relative;background:var(--bg-page);border-radius:var(--radius-sheet);padding:var(--space-4);color:var(--text-primary);min-width:0;font-family:var(--font-sans)}
.lab{margin:0 0 var(--space-2);color:var(--text-secondary)}.sec{margin:var(--space-4) 0 var(--space-2);color:var(--text-secondary)}.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}</style></head><body class="rm-root"><div class="mx"><div class="cell " data-theme="light"><p class="lab t-caption">Light</p><div style="position:relative;height:620px;overflow:hidden;border-radius:var(--radius-card)"><button type="button" class="c-voice-sheet__scrim" aria-label="Close settings"></button><section class="c-voice-sheet" role="dialog" aria-label="Voice settings"><div class="c-voice-sheet__handle"></div><div class="c-voice-sheet__head"><span></span><h2>Voice</h2><button type="button" class="c-voice-sheet__x" aria-label="Close"><i class="ph ph-x"></i></button></div><div class="c-voice-sheet__sec"><p class="c-voice-sheet__label">Voice</p><div class="c-voice-sheet__row"><button type="button" class="c-voice-sheet__card" aria-pressed="true"><b>Calm</b><span>Warm, steady</span></button><button type="button" class="c-voice-sheet__card" aria-pressed="false"><b>Bright</b><span>Upbeat, quick</span></button><button type="button" class="c-voice-sheet__card" aria-pressed="false"><b>Clear</b><span>Neutral, crisp</span></button></div></div><div class="c-voice-sheet__sec"><p class="c-voice-sheet__label">Speed</p><div class="c-voice-sheet__speed"><div class="c-voice-sheet__speed-fill" style="width:50%"></div><div class="c-voice-sheet__speed-knob" style="left:50%"></div><input type="range" min="0.75" max="1.5" step="0.05" value="1.1" aria-label="Speaking speed"></div><p class="c-voice-sheet__value">1.0×</p></div><div class="c-voice-sheet__list"><button type="button" class="c-voice-sheet__item" role="switch" aria-checked="true">Captions<input type="checkbox" class="rm-switch rm-switch--ios" checked tabindex="-1" aria-hidden="true"></button><button type="button" class="c-voice-sheet__item">Language<span style="color:var(--text-secondary)">English (US) <i class="ph ph-caret-right"></i></span></button></div></section></div></div><div class="cell " data-theme="dark"><p class="lab t-caption">Dark</p><div style="position:relative;height:620px;overflow:hidden;border-radius:var(--radius-card)"><button type="button" class="c-voice-sheet__scrim" aria-label="Close settings"></button><section class="c-voice-sheet" role="dialog" aria-label="Voice settings"><div class="c-voice-sheet__handle"></div><div class="c-voice-sheet__head"><span></span><h2>Voice</h2><button type="button" class="c-voice-sheet__x" aria-label="Close"><i class="ph ph-x"></i></button></div><div class="c-voice-sheet__sec"><p class="c-voice-sheet__label">Voice</p><div class="c-voice-sheet__row"><button type="button" class="c-voice-sheet__card" aria-pressed="true"><b>Calm</b><span>Warm, steady</span></button><button type="button" class="c-voice-sheet__card" aria-pressed="false"><b>Bright</b><span>Upbeat, quick</span></button><button type="button" class="c-voice-sheet__card" aria-pressed="false"><b>Clear</b><span>Neutral, crisp</span></button></div></div><div class="c-voice-sheet__sec"><p class="c-voice-sheet__label">Speed</p><div class="c-voice-sheet__speed"><div class="c-voice-sheet__speed-fill" style="width:50%"></div><div class="c-voice-sheet__speed-knob" style="left:50%"></div><input type="range" min="0.75" max="1.5" step="0.05" value="1.1" aria-label="Speaking speed"></div><p class="c-voice-sheet__value">1.0×</p></div><div class="c-voice-sheet__list"><button type="button" class="c-voice-sheet__item" role="switch" aria-checked="true">Captions<input type="checkbox" class="rm-switch rm-switch--ios" checked tabindex="-1" aria-hidden="true"></button><button type="button" class="c-voice-sheet__item">Language<span style="color:var(--text-secondary)">English (US) <i class="ph ph-caret-right"></i></span></button></div></section></div></div></div></body></html>
