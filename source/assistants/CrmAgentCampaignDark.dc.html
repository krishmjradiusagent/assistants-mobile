      setName: (e) => { const v = String(e.target.value); this.setState({ nameErrOff: false, name: v, savedName: v.trim() ? v.trim() : s.savedName }); },
      setDesc: (e) => this.setState({ desc: String(e.target.value) }),
      notifOn: s.notif,
      toggleNotif: () => this.setState({ notif: !s.notif }),
      tabs: ['Info', 'Documents', 'Links', 'Routines'].map((t) => ({ label: t, sel: s.editTab === t, pick: () => this.setState({ editTab: t }) })),
      isInfo: s.editTab === 'Info', isEmpty: s.editTab !== 'Info',
      emptyTitle: s.editTab === 'Documents' ? 'No documents' : s.editTab === 'Links' ? 'No links' : 'No routines',
      emptyText: s.editTab === 'Documents' ? 'Documents you add appear here.' : s.editTab === 'Links' ? 'Links you add appear here.' : 'Routines you add appear here.',
      e_files: s.editTab === 'Documents', e_link: s.editTab === 'Links', e_cal: s.editTab === 'Routines',
      sheetReset: s.sheet === 'reset', sheetDiscard: s.sheet === 'discard', showToast: s.toast,
      openInstr: () => this.setState({ view: 'instr', instrDraft: s.instr, sheet: null }),
      instrDraft: s.instrDraft, setInstrDraft: (e) => this.setState({ instrDraft: String(e.target.value) }),
      instrCount: s.instrDraft.length + ' / 500',
      instrDirty: s.instrDraft !== s.instr, instrClean: s.instrDraft === s.instr,
      instrBack: () => { if (s.instrDraft !== s.instr) this.setState({ sheet: 'discard' }); else this.setState({ view: 'edit', sheet: null }); },
      instrDiscard: () => this.setState({ view: 'edit', sheet: null, instrDraft: s.instr }),
      instrSave: () => { if (this.toastTimer) clearTimeout(this.toastTimer); this.setState({ instr: s.instrDraft, view: 'edit', sheet: null, toast: true }); this.toastTimer = setTimeout(() => this.setState({ toast: false }), 2600); },
      openReset: () => this.setState({ sheet: 'reset' }),
      closeSheet: () => this.setState({ sheet: null }),
      confirmReset: () => this.setState({ name: DEFAULTS.name, savedName: DEFAULTS.name, desc: DEFAULTS.desc, instr: '', instrDraft: '', notif: true, nameErrOff: false, sheet: null }),
      menuOpen: s.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      msgs: s.msgs.map((m) => ({
        isUser: m.role === 'user', isMel: m.role === 'mel',
        text: m.text, title: m.title || '', hasTitle: !!m.title, hasTail: !!m.tail, tail: m.tail || '', thinking: !!m.thinking, hasText: !m.thinking, acts: !!m.acts
      })),
      cards: s.acts.map((id) => ({ text: ROW(id), cls: 'c-prompt-row' + (id === 'more' ? ' c-prompt-row--more' : ''), pick: (e) => this.pick(id, rootOf(e)) })),
      links: [],
      hasCards: s.acts.length > 0,
      hasLinks: false,
      draft: s.draft,
      typing: !!s.draft.trim(), canSend: !!s.draft.trim(), cantSend: !s.draft.trim(),
      setDraft: (e) => this.setState({ draft: String(e.target.value) }),
      key: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(e); } },
      send: (e) => { e.preventDefault(); ask(e); }
    };
  }
}
</script>
