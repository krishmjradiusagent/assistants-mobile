<!doctype html>
<html lang="en" data-theme="dark" data-expression="quiet" data-platform="ios">
<head>
<meta charset="utf-8">
<title>Intro, state 2, CRM empty, dark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/radius-mobile/components/bundle.css">
<link rel="stylesheet" href="mel-brand.css?v=112">
<link rel="stylesheet" href="mel-chat-overrides.css?v=113">
<link rel="stylesheet" href="c-prompt-row.css?v=109">
<link rel="stylesheet" href="c-skill-pills.css?v=109">
<link rel="stylesheet" href="c-typeset-chat.css?v=1">

<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.c-thinking{display:flex !important;flex-direction:row;align-items:center;gap:8px;margin:0 !important;min-height:20px;line-height:20px}
.c-thinking>*{margin:0 !important}
.typeset .c-thinking,.typeset .c-thinking>*{margin-block-start:0 !important}
.c-thinking .c-trace__spin{flex:none;display:inline-block;width:12px;height:12px;margin:0;border-radius:50%;border:1.8px solid var(--border-card);border-top-color:var(--text-primary);animation:c-trace-spin .8s linear infinite}
.c-thinking__text{display:inline-block;line-height:20px}
@keyframes c-trace-spin{to{transform:rotate(360deg)}}
.m-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-top:var(--space-2)}
.m-card{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2);width:100%;min-height:var(--size-hit-ios);padding:var(--space-3);border:0;border-radius:var(--radius-card);background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-card);color:var(--text-primary);font:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.m-card:active{background:var(--surface-tile)}
.m-card:focus-visible{outline:2px solid var(--text-primary);outline-offset:2px}
.m-card__text{overflow-wrap:anywhere}
</style>
</helmet>
<div class="rm-root" data-theme="dark" data-expression="quiet" data-platform="ios" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans)">

<div data-scroll="1" style="position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--space-8) + var(--size-control-lg) + var(--space-10)) var(--space-gutter) calc(var(--size-control-lg) * 5 + var(--space-8) + var(--space-4))">
<div class="rm-stack rm-stack--loose">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
<div class="rm-stack">
<sc-if value="{{m.isUser}}" hint-placeholder-val="{{ false }}">
<article class="c-ai-message c-ai-message--user" data-slot="message" data-from="user" aria-label="Your message">
<div class="c-ai-message__content" data-slot="message-content"><div class="rm-card rm-card--bordered"><p class="t-body" style="margin: 0">{{m.text}}</p></div></div>
</article>
</sc-if>
<sc-if value="{{m.isMel}}" hint-placeholder-val="{{ true }}">
<article class="c-ai-message c-ai-message--assistant" data-slot="message" data-from="assistant" aria-label="MEL message">
<div class="c-ai-message__content" data-slot="message-content">
<sc-if value="{{m.hasTrace}}" hint-placeholder-val="{{ false }}"><div class="c-trace" data-running="{{m.traceRunning}}">
<button type="button" class="c-trace__sum" aria-expanded="{{m.traceOpen}}" onClick="{{m.toggleTrace}}">
<span class="c-trace__icon" aria-hidden="true"><sc-if value="{{m.traceRunning}}" hint-placeholder-val="{{ true }}"><span class="c-trace__spin"></span></sc-if><sc-if value="{{m.traceDone}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.2l1.9 1.9 3.8-4"></path></svg></sc-if></span>
<span class="c-trace__title">{{m.traceTitle}}</span>
<svg class="c-trace__chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"></path></svg>
</button>
<sc-if value="{{m.traceOpen}}" hint-placeholder-val="{{ true }}"><div class="c-trace__steps">
<sc-for list="{{m.steps}}" as="s" hint-placeholder-count="2">
<div class="c-trace__line" data-status="{{s.status}}"><span class="c-trace__icon" aria-hidden="true"><sc-if value="{{s.running}}" hint-placeholder-val="{{ false }}"><span class="c-trace__spin"></span></sc-if><sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"></circle><path d="M5.2 8.2l1.9 1.9 3.8-4"></path></svg></sc-if></span><span class="c-trace__text">{{s.text}}</span></div>
</sc-for>
</div></sc-if>
</div></sc-if>
<div class="c-streaming-text c-mel-plain typeset typeset-chat">
<sc-if value="{{m.thinkingPlain}}" hint-placeholder-val="{{ false }}"><p class="t-meta t-secondary c-thinking" role="status" style="margin: 0"><span class="c-trace__spin" aria-hidden="true"></span><span class="c-thinking__text">Thinking…</span></p></sc-if>
<sc-if value="{{m.hasText}}" hint-placeholder-val="{{ true }}"><p class="c-streaming-text__body" style="margin: 0; white-space: pre-line">{{m.text}}</p></sc-if>
</div>
<sc-if value="{{m.hasList}}" hint-placeholder-val="{{ true }}"><div class="m-cards" role="list" aria-label="What MEL can do">
<sc-for list="{{m.list}}" as="c" hint-placeholder-count="6">
<button type="button" class="m-card" role="listitem" onClick="{{c.pick}}"><span class="mb-mark mb-mark--inline" data-skill="{{c.skill}}" role="img" aria-label="Mel"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true"><path d="M48 8 H72 A40 40 0 0 1 112 48 V72 A40 40 0 0 1 72 112 H19 A11 11 0 0 1 8 101 V48 A40 40 0 0 1 48 8 Z" fill="currentColor"></path><circle class="mb-dot" cx="60" cy="60" r="13" fill="#FFFFFF"></circle></svg></span><span class="m-card__text t-body-strong">{{c.text}}</span></button>
</sc-for>
</div></sc-if>
<sc-if value="{{m.hasRows}}" hint-placeholder-val="{{ false }}"><div class="c-prompt-rows" aria-label="Suggested prompts">
<sc-for list="{{m.rows}}" as="c" hint-placeholder-count="3">
<button type="button" class="c-prompt-row" onClick="{{c.send}}"><svg class="c-prompt-row__glyph" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2.5v6a2 2 0 0 0 2 2h6.5"></path><path d="M10 7.5l3 3-3 3"></path></svg><span class="c-prompt-row__text t-body-strong">{{c.text}}</span></button>
</sc-for>
</div></sc-if>
</div>
</article>
</sc-if>
</div>
</sc-for>
</div>
</div>

<header class="c-glass-header c-glass-header--soft-edge" style="position: absolute; inset: 0 0 auto 0; z-index: 7; display: grid; grid-template-columns: var(--size-control) minmax(0, 1fr) auto; align-items: center; gap: var(--space-3); padding: var(--space-8) var(--space-gutter) var(--space-3)">
<button type="button" class="rm-btn rm-btn--glass" aria-label="Back to Radius home"><svg class="ph" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg></button>
<div style="display: flex; align-items: center; justify-content: center; gap: var(--space-2); min-width: 0"><span class="mb-mark mb-mark--dock" data-skill="{{skin}}" role="img" aria-label="Mel"><svg viewBox="0 0 120 120" fill="none" aria-hidden="true"><path d="M48 8 H72 A40 40 0 0 1 112 48 V72 A40 40 0 0 1 72 112 H19 A11 11 0 0 1 8 101 V48 A40 40 0 0 1 48 8 Z" fill="currentColor"></path><circle class="mb-dot" cx="60" cy="60" r="13" fill="#FFFFFF"></circle></svg></span><span class="t-row-title" style="min-width: 0; overflow-wrap: anywhere">MEL</span></div>
<div style="display: flex; align-items: center; gap: var(--space-2)"><button type="button" class="rm-btn rm-btn--glass" aria-label="New chat" onClick="{{newChat}}"><svg class="ph" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66,58.34l-32-32a8,8,0,0,0-11.32,0l-96,96A8,8,0,0,0,88,128v32a8,8,0,0,0,8,8h32a8,8,0,0,0,5.66-2.34l96-96A8,8,0,0,0,229.66,58.34ZM124.69,152H104V131.31l64-64L188.69,88ZM200,76.69,179.31,56,192,43.31,212.69,64ZM224,128v80a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V48A16,16,0,0,1,48,32h80a8,8,0,0,1,0,16H48V208H208V128a8,8,0,0,1,16,0Z"></path></svg></button><button type="button" class="rm-btn rm-btn--glass" aria-label="More" aria-haspopup="menu" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}"><svg class="ph" width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128ZM84,116a12,12,0,1,0,12,12A12,12,0,0,0,84,116Zm88,0a12,12,0,1,0,12,12A12,12,0,0,0,172,116Z"></path></svg></button></div>
</header>

<footer class="c-glass-footer c-glass-footer--soft-edge" style="padding: var(--space-3) var(--space-gutter) calc(var(--space-3) + var(--space-8))">
<form class="c-chat-composer" aria-label="Message composer" data-typing="{{typing}}" data-generating="{{generating}}" onSubmit="{{send}}">
<textarea rows="1" class="c-chat-composer__field t-body" aria-label="Message MEL" placeholder="Ask anything" value="{{draft}}" onChange="{{setDraft}}" onKeyDown="{{key}}"></textarea>
<div class="c-chat-composer__toolbar"><div class="c-chat-composer__idle"><button type="button" class="rm-btn rm-btn--secondary c-chat-composer__icon" aria-label="Attachments and connected sources" aria-haspopup="menu"><svg width="20" height="20" class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg></button><span class="c-chat-composer__spacer"></span><button type="button" class="rm-btn rm-btn--secondary c-chat-composer__icon" aria-label="Dictate message"><svg width="20" height="20" class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,176a48.05,48.05,0,0,0,48-48V64a48,48,0,0,0-96,0v64A48.05,48.05,0,0,0,128,176ZM96,64a32,32,0,0,1,64,0v64a32,32,0,0,1-64,0Zm40,143.6V240a8,8,0,0,1-16,0V207.6A80.11,80.11,0,0,1,48,128a8,8,0,0,1,16,0,64,64,0,0,0,128,0,8,8,0,0,1,16,0A80.11,80.11,0,0,1,136,207.6Z"></path></svg></button><button type="button" class="rm-btn rm-btn--voice c-chat-composer__speak" aria-label="Speak to MEL"><svg width="20" height="20" class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M222.37,158.46l-47.11-21.11-.13-.06a16,16,0,0,0-15.17,1.4,8.12,8.12,0,0,0-.75.56L134.87,160c-15.42-7.49-31.34-23.29-38.83-38.51l20.78-24.71c.2-.25.39-.5.57-.77a16,16,0,0,0,1.32-15.06l0-.12L97.54,33.64a16,16,0,0,0-16.62-9.52A56.26,56.26,0,0,0,32,80c0,79.4,64.6,144,144,144a56.26,56.26,0,0,0,55.88-48.92A16,16,0,0,0,222.37,158.46ZM176,208A128.14,128.14,0,0,1,48,80,40.2,40.2,0,0,1,82.87,40a.61.61,0,0,0,0,.12l21,47L83.2,111.86a6.13,6.13,0,0,0-.57.77,16,16,0,0,0-1,15.7c9.06,18.53,27.73,37.06,46.46,46.11a16,16,0,0,0,15.75-1.14,8.44,8.44,0,0,0,.74-.56L168.89,152l47,21.05h0s.08,0,.11,0A40.21,40.21,0,0,1,176,208Z"></path></svg><span class="t-body-strong">Speak</span></button></div><button type="submit" class="rm-btn rm-btn--primary c-chat-composer__send" aria-label="Send message"><svg width="20" height="20" class="ph" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,117.66a8,8,0,0,1-11.32,0L136,59.31V216a8,8,0,0,1-16,0V59.31L61.66,117.66a8,8,0,0,1-11.32-11.32l72-72a8,8,0,0,1,11.32,0l72,72A8,8,0,0,1,205.66,117.66Z"></path></svg></button><button type="button" class="rm-btn rm-btn--primary c-chat-composer__stop" aria-label="Stop generating" onClick="{{stop}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2"></rect></svg></button></div>
</form>
</footer>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

const QUESTION = 'Do you want to start by adding your clients? Reply yes, or pick a number.';
const YES_SKILL = 'crm';
const SKILLS = [
  { id: 'crm', name: 'CRM', row: 'Manage clients', title: 'MEL CRM', mel: 'Let’s bring your contacts together so I can help you manage relationships and follow-ups.\n\nHow would you like to add your contacts?', rows: ['Upload a CSV', 'Import from another CRM', 'I’ll add contacts later'] },

  { id: 'campaign', name: 'Campaigns', row: 'Start a campaign', title: 'MEL Campaigns', mel: 'I set up drip emails and texts for a group of clients and keep them running.\n\nWho should this campaign reach?', rows: ['Buyers in my CRM', 'Past clients', 'Pick clients myself'] },

  { id: 'mls', name: 'MLS', row: 'Explore listings', title: 'MEL MLS', mel: 'I search listings, pull comps and track changes for you.\n\nWhat do you want to look up?', rows: ['Find homes for a buyer', 'Pull comps for an address'] },
  { id: 'compliance', name: 'Compliance', row: 'Check compliance', title: 'MEL Compliance', mel: 'I check your transaction files and flag what is missing before it becomes a problem.\n\nWhich transaction should I check?', rows: ['Check my open transactions', 'Check one file'] },
  { id: 'document', name: 'Document', row: 'Review documents', title: 'MEL Document', mel: 'I read, summarise and prepare documents for signature.\n\nWhich document should I start with?', rows: ['Summarise a contract', 'Prepare a document for signing'] }
];
const ROUTE = [[/campaign|drip/i, 'campaign'], [/keep clients|client experience|portal/i, 'client'], [/post|flyer|reel|market|social|instagram/i, 'marketing'], [/comp|listing|mls|homes? for|search homes/i, 'mls'], [/compliance|disclosure|transaction file/i, 'compliance'], [/contract|document|sign/i, 'document'], [/client|contact|follow.?up|lead|crm/i, 'crm']];
const FALLBACK = 'Got it. Tell me which client or listing and I start there.';
const TRACES = {
  crm: { running: 'Checking your CRM', summary: 'Checked 2 things', steps: ['Checked your CRM · 0 contacts', 'Checked connected tools · none'] },

const NEXT = {
  'upload a csv': 'Attach your contacts file here. Any CSV works, I read the columns myself.',
  'import from another crm': 'Which CRM are you on now? I connect to Follow Up Boss, kvCORE and Salesforce.',
  'i’ll add contacts later': 'No problem. I ask again when you share your first client.',
  'market my newest listing': 'Starting the package for 124 Oak Street: posts, reels, flyers, email, website and yard sign. Pick a style first.',
  'pick from my active listings': 'You have 3 active listings. Which one?'
};
const NEXT_ROWS = {
  'market my newest listing': ['Modern', 'Classic', 'Bold'],
  'pick from my active listings': ['124 Oak Street', '88 Pine Avenue', '12 Harbor Lane']

function skillByText(t) {
  const low = t.toLowerCase().trim();
  const num = low.match(/^([1-6])\b/);
  if (num) { const id = LINE_SKILLS[Number(num[1]) - 1]; return SKILLS.filter((k) => k.id === id)[0]; }

}

  pick(text, root) {

    this.setState({ draft: text });
    setTimeout(() => { try { const f = root && root.querySelector('.c-chat-composer__field'); if (f) f.focus(); } catch (e) {} }, 30);
  }
  toggleTrace(i) { const msgs = this.state.msgs.slice(); const m = msgs[i]; if (!m || !m.trace) return; msgs[i] = Object.assign({}, m, { trace: Object.assign({}, m.trace, { open: !m.trace.open }) }); this.setState({ msgs: msgs }); }
  ask(text, root) {
    const t = String(text || '').trim();
    if (!t || this.state.typing) return;
    const k = this.state.skill ? null : skillByText(t);
    const nx = this.state.skill ? nextMsg(t) : null;
    const final = k ? skillMsg(k) : (nx || { role: 'mel', text: FALLBACK, rows: [] });
    const prev = this.state.msgs.map((m) => Object.assign({}, m, { rows: [] }));
    const pending = k ? runningMsg(k) : { role: 'mel', text: '', thinking: true, rows: [] };
    this.setState({ msgs: prev.concat([(t.toLowerCase().trim() === 'send' ? { role: 'user', text: '', silent: true } : { role: 'user', text: t }), pending]), draft: '', typing: true, focus: true, skill: k ? k.id : this.state.skill });
    this.scrollDown(root);
    const words = final.text.split(' ');

        const msgs = this.state.msgs.slice();
        const done = n >= words.length;

  }

    if (last && last.role === 'mel') { msgs[msgs.length - 1] = Object.assign({}, last, { thinking: false, text: last.text || 'Stopped. Tell me what to do instead.', trace: last.trace ? Object.assign({}, last.trace, { running: false, open: false, title: 'Stopped' }) : undefined }); }

  }
  renderVals() {

      menuOpen: s.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      newChat: () => this.reset(),
      msgs: (s.focus ? s.msgs.slice(Math.max(0, s.msgs.map((m) => m.role).lastIndexOf('user'))) : s.msgs).map((m, i) => ({

        hasTrace: !!m.trace, traceRunning: !!(m.trace && m.trace.running), traceDone: !!(m.trace && !m.trace.running), traceOpen: !!(m.trace && m.trace.open), traceTitle: m.trace ? m.trace.title : '',
        toggleTrace: () => this.toggleTrace(s.focus ? Math.max(0, s.msgs.map((m) => m.role).lastIndexOf('user')) + i : i),
        steps: (m.trace ? m.trace.steps : []).map((st, j) => { const run = !!(m.trace.live && j === m.trace.steps.length - 1); return { text: st, status: run ? 'running' : 'done', running: run, done: !run }; }),
        hasList: !!(m.list && m.list.length), list: (m.list || []).map((r, j) => ({ skill: LINE_SKILLS[j], text: r, pick: (e) => this.pick(r, rootOf(e)) })),
        hasRows: !!(m.rows && m.rows.length), rows: (m.rows || []).map((r) => ({ text: r, send: (e) => this.ask(r, rootOf(e)) }))
      })),
      draft: s.draft,
      generating: !!s.typing, stop: () => this.stop(),
      typing: !!s.draft.trim(), canSend: !!s.draft.trim(), cantSend: !s.draft.trim(),
      setDraft: (e) => this.setState({ draft: String(e.target.value) }),
      key: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.ask(s.draft, rootOf(e)); } },
      send: (e) => { e.preventDefault(); this.ask(s.draft, rootOf(e)); }
    };
  }
}
</script>
