<script type="text/x-dc" data-dc-script data-props='{"concept":{"editor":"enum","options":["a","b","c"],"default":"a"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
const T = 7;
// [word, start s, stress 0-1]. Pause after "days." and a rest at the end, like a real sentence.
const WORDS = [['Sarah',0,.9],['hasn’t',.36,.45],['replied',.62,.8],['in',1.0,.2],['5',1.14,.55],['days.',1.42,.85],['I',2.45,.3],['drafted',2.6,.9],['a',2.98,.2],['short',3.08,.6],['follow-up.',3.42,1]];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { n: 0 }; }
  componentDidMount() { this.t0 = performance.now(); const tick = (now) => { this.setState({ n: ((now - this.t0) / 1000) % T }); this.raf = requestAnimationFrame(tick); }; this.raf = requestAnimationFrame(tick); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    const c = this.props.concept || 'a';
    const n = this.state.n;
    const talking = (n < 2.0) || (n >= 2.45 && n < 4.1);
    let env = 0;
    WORDS.forEach((w) => { if (n >= w[1]) env = w[2] * Math.min(1, (n - w[1]) / 0.08) * Math.exp(-(n - w[1]) / 0.38); });
    if (!talking) env = 0;
    return {
      theme: this.props.theme === 'light' ? 'light' : 'dark',
      isA: c === 'a', isB: c === 'b', isC: c === 'c',
      talking: talking, resting: !talking,
      markScale: 'scale(' + (1 + 0.06 * env).toFixed(3) + ')',
      words: WORDS.map((w) => ({ t: w[0], d: w[1] + 's', s: String(w[2]), lit: n >= w[1] && n < 6.6 ? 'true' : 'false' }))
    };
  }
}
</script>
